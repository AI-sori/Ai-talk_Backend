server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: true
        same-site: none
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
spring:
  main:
    allow-bean-definition-overriding: true
    # db 관련 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_url}:${DB_port}/${DB_dataBaseName}?useUnicode=yes&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Seoul
    username: ${DB_name} #유저네임
    password: ${DB_password} #암호
  jpa:
    hibernate:
      ddl-auto: update #JPA 자동 테이블 생성
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  security:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_bucket_name}